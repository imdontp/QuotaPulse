<script>
for (const panel of document.querySelectorAll('details')) {
  const controls = document.createElement('div');
  controls.className = 'controls';
  controls.innerHTML = '<label><input type="checkbox"> ซ้อนภาพ</label><label hidden>สัดส่วนภาพแอป <input type="range" min="0" max="100" value="50"></label>';
  panel.querySelector('.pair').before(controls);
  const [toggle, slider] = controls.querySelectorAll('input');
  toggle.addEventListener('change', () => {
    panel.classList.toggle('overlay', toggle.checked);
    slider.parentElement.hidden = !toggle.checked;
  });
  slider.addEventListener('input', () => panel.style.setProperty('--split', slider.value + '%'));
}
</script></html>
