<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuotaPulse Overview v1.50 review</title>
<style>body{margin:0;background:#040a14;color:#eef3ff;font:15px system-ui,sans-serif}header{padding:20px;display:grid;gap:12px}h1{font-size:22px;margin:0}p{margin:0;color:#a6b9dc}fieldset{display:flex;gap:20px;flex-wrap:wrap;border:1px solid #32455f;padding:12px}label{display:flex;align-items:center;gap:8px}select{font:inherit;background:#08101b;color:#eef3ff;padding:6px;border:1px solid #52657c}:focus-visible{outline:2px solid #36c9ff;outline-offset:3px}main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}figure{margin:0;min-width:0}figcaption{padding:8px;color:#a6b9dc}img{display:block;width:100%;height:auto}.overlay main{display:block;position:relative;padding:0;margin:12px}.overlay figure:last-child{position:absolute;inset:0;opacity:var(--app-opacity,.5)}.overlay figcaption{display:none}@media(max-width:800px){main{grid-template-columns:1fr}}</style>
<header><h1>QuotaPulse Overview v1.50</h1><p>เปรียบเทียบ refs กับภาพแอปที่ใช้ daemon และฐานข้อมูลจำลอง ชื่อ ตัวเลข และกราฟเป็นข้อมูลทดสอบ ไม่มีคะแนนความเหมือนหรือการอนุมัติ visual acceptance ภาพต้นฉบับมีเฉพาะธีมมืด</p>
<fieldset><legend>ภาพแอป</legend><label>รุ่น <select id="version"><option value="v1.50">v1.50 ปัจจุบัน</option><option value="v1.49">v1.49 ก่อนปรับ</option></select></label><label>ภาษา <select id="language"><option value="en">English</option><option value="th">ไทย</option></select></label><label>ธีม <select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label><label><input id="overlay" type="checkbox">ซ้อนภาพ</label><label>ความทึบภาพแอป <input id="opacity" type="range" min="0" max="100" value="50"><output id="value">50%</output></label></fieldset></header>
<main><figure><figcaption>Source concept</figcaption><img src="source-overview.png" alt="Overview source concept"></figure><figure><figcaption>Production app — synthetic fixture</figcaption><img id="capture" src="overview-en-dark.png" alt="Overview English dark production capture"></figure></main>
<script>const language=document.getElementById('language'),theme=document.getElementById('theme'),version=document.getElementById('version');function update(){const base=version.value==='v1.49'?'../redesign-v1.49/':'';document.getElementById('capture').src=base+`overview-${language.value}-${theme.value}.png`;document.getElementById('capture').alt=`Overview ${language.value} ${theme.value} production capture`}language.addEventListener('change',update);theme.addEventListener('change',update);version.addEventListener('change',update);document.getElementById('overlay').addEventListener('change',event=>document.body.classList.toggle('overlay',event.target.checked));document.getElementById('opacity').addEventListener('input',event=>{document.body.style.setProperty('--app-opacity',event.target.value/100);document.getElementById('value').value=`${event.target.value}%`});</script>
</html>
