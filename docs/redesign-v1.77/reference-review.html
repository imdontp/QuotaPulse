<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuotaPulse concept review v1.77</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#040a14;color:#eef3ff;font:15px system-ui,sans-serif}header{padding:20px;display:grid;gap:12px}h1{margin:0;font-size:22px}p{margin:0;color:#a6b9dc;line-height:1.5}fieldset{display:flex;gap:16px;flex-wrap:wrap;border:1px solid #32455f;padding:12px}label{display:flex;align-items:center;gap:8px}select{font:inherit;background:#08101b;color:#eef3ff;padding:6px;border:1px solid #52657c}:focus-visible{outline:2px solid #36c9ff;outline-offset:3px}main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}figure{margin:0;min-width:0}figcaption{padding:8px;color:#a6b9dc}img{display:block;width:100%;height:auto}.overlay main{display:block;position:relative;padding:0;margin:12px}.overlay figure:last-child{position:absolute;inset:0;opacity:var(--app-opacity,.5)}.overlay figcaption{display:none}.settings main{grid-template-columns:1fr}.settings figure:first-child{display:none}@media(max-width:800px){main{grid-template-columns:1fr}}
</style>
<header>
  <h1>QuotaPulse — concept and app comparison v1.77</h1>
  <p>Current Overview captures use a deterministic fixture for review. The running app continues to show daemon data. Use the overlay control to compare placement and color; it does not claim visual acceptance.</p>
  <fieldset>
    <legend>Capture options</legend>
    <label>Version <select id="version"><option value="v1.77">v1.77 current</option><option value="v1.76">v1.76 previous</option><option value="v1.75">v1.75</option><option value="v1.74">v1.74</option></select></label>
    <label>Page <select id="page"><option>overview</option><option>live</option><option>projects</option><option>providers</option><option>models</option><option>cost</option><option>history</option><option>alerts</option><option>settings</option></select></label>
    <label>Overview state <select id="state"><option value="full">Full Overview</option><option value="quota">Expanded quota history</option><option value="runtime">Expanded Runtime Map</option></select></label>
    <label>Language <select id="language"><option value="en">English</option><option value="th">Thai</option></select></label>
    <label>Theme <select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label>
    <label><input id="overlay" type="checkbox">Overlay images</label>
    <label>App opacity <input id="opacity" type="range" min="0" max="100" value="50"><output id="value">50%</output></label>
  </fieldset>
  <p id="note" role="status"></p>
</header>
<main>
  <figure id="sourceFigure"><figcaption>Source concept</figcaption><img id="source" src="../redesign-v1.44/source-overview.png" alt="Overview source concept"></figure>
  <figure><figcaption id="captureCaption">Production app — synthetic review fixture</figcaption><img id="capture" src="overview-en-dark.png" alt="Overview English dark production capture"></figure>
</main>
<script>
const page=document.getElementById('page'),language=document.getElementById('language'),theme=document.getElementById('theme'),version=document.getElementById('version'),state=document.getElementById('state'),overlay=document.getElementById('overlay');
const roots={'v1.77':'','v1.76':'../redesign-v1.76/','v1.75':'../redesign-v1.75/','v1.74':'../redesign-v1.74/'};
const states={full:'overview',quota:'quota-expanded-overview',runtime:'runtime-expanded'};
function update(){
  const name=page.value,settings=name==='settings',overview=name==='overview',hasStates=overview&&['v1.77','v1.76','v1.75','v1.74'].includes(version.value),carriedPage=!overview&&['v1.77','v1.76','v1.75'].includes(version.value);
  document.body.classList.toggle('settings',settings);overlay.disabled=settings;state.disabled=!hasStates;
  if(settings){overlay.checked=false;document.body.classList.remove('overlay')}
  const source=document.getElementById('source'),sourceFigure=document.getElementById('sourceFigure');sourceFigure.hidden=settings;
  if(!settings){source.src='../redesign-v1.44/source-'+name+'.png';source.alt=name+' source concept'}
  const root=carriedPage?'../redesign-v1.68/':(roots[version.value]||'');
  const filename=hasStates?states[state.value]+'-'+language.value+'-'+theme.value+'.png':(name==='history'?'history-selected':name)+'-'+language.value+'-'+theme.value+'.png';
  const capture=document.getElementById('capture');capture.src=root+filename;capture.alt=name+' '+language.value+' '+theme.value+' app capture';
  document.getElementById('captureCaption').textContent='App capture — '+(carriedPage?'v1.68 page carried forward in review sets':version.value+' '+(hasStates?state.options[state.selectedIndex].text:''));
  document.getElementById('note').textContent=settings?'No Settings source concept image is available.':hasStates?'Overview state captures use deterministic data for visual review.':carriedPage?'This non-Overview page is carried forward from v1.68 in later review sets.':'The source concept file is unchanged and recorded in the reference hash manifest.';
}
[page,language,theme,version,state].forEach(control=>control.addEventListener('change',update));
overlay.addEventListener('change',()=>document.body.classList.toggle('overlay',overlay.checked));
document.getElementById('opacity').addEventListener('input',event=>{document.body.style.setProperty('--app-opacity',event.target.value/100);document.getElementById('value').value=event.target.value+'%'});
update();
</script>
</html>
