<!doctype html>
<html lang="th">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuotaPulse reference review v1.60</title>
<style>body{margin:0;background:#040a14;color:#eef3ff;font:15px system-ui,sans-serif}header{padding:20px;display:grid;gap:12px}h1{margin:0;font-size:22px}p{margin:0;color:#a6b9dc}fieldset{display:flex;gap:20px;flex-wrap:wrap;border:1px solid #32455f;padding:12px}label{display:flex;align-items:center;gap:8px}select{font:inherit;background:#08101b;color:#eef3ff;padding:6px;border:1px solid #52657c}:focus-visible{outline:2px solid #36c9ff;outline-offset:3px}main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}figure{margin:0;min-width:0}figcaption{padding:8px;color:#a6b9dc}img{display:block;width:100%;height:auto}.overlay main{display:block;position:relative;padding:0;margin:12px}.overlay figure:last-child{position:absolute;inset:0;opacity:var(--app-opacity,.5)}.overlay figcaption{display:none}.settings main{grid-template-columns:1fr}.settings figure:first-child{display:none}@media(max-width:800px){main{grid-template-columns:1fr}}</style>
<header><h1>QuotaPulse — refs เทียบแอป v1.60</h1><p>ภาพแอปใช้ daemon กับฐานข้อมูลจำลอง ชื่อ ตัวเลข และกราฟเป็นข้อมูลทดสอบ ไม่มีคะแนนความเหมือนหรือการอนุมัติ visual acceptance แอปใช้งานแสดงข้อมูลจริง</p>
<fieldset><legend>ภาพแอป</legend>
<label>รุ่น <select id="version"><option value="v1.60">v1.60 ปัจจุบัน</option><option value="v1.52">v1.52 ชุดครบหน้าก่อนหน้า</option></select></label>
<label>หน้า <select id="page"><option>overview</option><option>live</option><option>projects</option><option>providers</option><option>models</option><option>cost</option><option>history</option><option>alerts</option><option>settings</option></select></label>
<label>ภาษา <select id="language"><option value="en">English</option><option value="th">ไทย</option></select></label>
<label>ธีม <select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label>
<label>ชุดข้อมูล <select id="fixture"><option value="canonical">ชุดตรวจหลัก</option><option value="marks">ชื่อโมเดลที่จำแนกตระกูลได้</option></select></label>
<label><input id="overlay" type="checkbox">ซ้อนภาพ</label><label>ความทึบภาพแอป <input id="opacity" type="range" min="0" max="100" value="50"><output id="value">50%</output></label></fieldset>
<p id="note">ภาพต้นฉบับมีเฉพาะธีมมืด ใช้ไฟล์ refs ที่ตรวจ hash และเก็บไว้ในชุด v1.44 โดยไม่แก้ไข</p></header>
<main><figure><figcaption>Source concept</figcaption><img id="source" src="../redesign-v1.44/source-overview.png" alt="Overview source concept"></figure><figure><figcaption>Production app — synthetic fixture</figcaption><img id="capture" src="overview-en-dark.png" alt="Overview English dark production capture"></figure></main>
<script>
const page=document.getElementById('page'),language=document.getElementById('language'),theme=document.getElementById('theme'),version=document.getElementById('version'),fixture=document.getElementById('fixture'),overlay=document.getElementById('overlay');
function update(){const name=page.value,settings=name==='settings',current=version.value==='v1.60';document.body.classList.toggle('settings',settings);overlay.disabled=settings;fixture.disabled=!current||name!=='overview';if(settings){overlay.checked=false;document.body.classList.remove('overlay')}const marks=current&&name==='overview'&&fixture.value==='marks';document.getElementById('note').textContent=settings?'Settings ไม่มีภาพต้นฉบับใน refs':marks?'ภาพวินิจฉัย: เปลี่ยนเฉพาะชื่อโมเดลในฐานข้อมูลจำลองเพื่อทดสอบ OpenAI, Anthropic, DeepSeek และ Nous จำนวน token และความสัมพันธ์มาจาก API จริง ภาพนี้ไม่ใช่ baseline ที่อนุมัติแล้ว':'ภาพต้นฉบับมีเฉพาะธีมมืด ใช้ไฟล์ refs ที่ตรวจ hash และเก็บไว้ในชุด v1.44 โดยไม่แก้ไข';if(!settings){document.getElementById('source').src=`../redesign-v1.44/source-${name}.png`;document.getElementById('source').alt=`${name} source concept`}document.getElementById('capture').src=(current?'':'../redesign-v1.52/')+`${marks?'model-marks':name}-${language.value}-${theme.value}.png`;document.getElementById('capture').alt=`${name} ${language.value} ${theme.value} production capture`}
[page,language,theme,version,fixture].forEach(control=>control.addEventListener('change',update));overlay.addEventListener('change',()=>document.body.classList.toggle('overlay',overlay.checked));document.getElementById('opacity').addEventListener('input',event=>{document.body.style.setProperty('--app-opacity',event.target.value/100);document.getElementById('value').value=`${event.target.value}%`});
</script></html>
