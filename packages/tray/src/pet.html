<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QuotaPulse PulsePet</title>
<style>
  :root {
    --pet: #22d3a7;
    --alert: #ffb020;
    --pet-size: 64px;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  #stage { position: relative; width: 100vw; height: 100vh; }

  /*
   * Two layers on purpose (spec §27, §30):
   *   #pet-wrap  -- DESKTOP motion. Its transform is the walk position, set from JS only.
   *   #pet       -- BODY motion. All CSS animation lives here so a breath or a bounce can
   *                 never clobber the walk position the way a single element would.
   */
  /*
   * Wave 3: the sprite lives at an absolute (x, y) inside the desktop overlay. `top/left:0`
   * plus a translate keeps it on its own compositor layer, exactly as the old strip did.
   */
  #pet-wrap {
    position: absolute;
    top: 0;
    left: 0;
    width: var(--pet-size);
    height: var(--pet-size);
    transform-origin: 50% 88%;
    will-change: transform;
  }
  #pet {
    position: absolute;
    inset: 0;
    background-image: url('../assets/pets/orbit-bot/sprite/pulsepet_states_sprite.png');
    background-repeat: no-repeat;
    background-size: 320px 64px;
    background-position: 0 0;
    cursor: pointer;
    will-change: transform;
    transform-origin: 50% 88%;
    filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.45));
  }
  #pet-wrap.dragging #pet { cursor: grabbing; }
  #pet-wrap.position-locked #pet { cursor: default; }

  /*
   * Wave 3 skin layer (SKIN_THEME_ARCHITECTURE.md §3–§4): a decorative accent trim plus an
   * optional accessory overlay from the active skin. Both are NON-semantic -- status colors
   * (--pet/--alert) are never touched by the skin.
   */
  #accessory {
    position: absolute;
    left: 14px;
    top: -12px;
    width: 36px;
    height: 24px;
    display: none;
    pointer-events: none;
  }
  #accessory.show { display: block; }
  #accessory img { width: 100%; height: 100%; }
  #skin-trim {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: -2px;
    height: 4px;
    display: none;
    border-radius: 3px;
    background: var(--skin-accent, var(--pet));
    opacity: 0.4;
    pointer-events: none;
  }
  #pet-wrap.skin-applied #skin-trim { display: block; }

  /* Body motion per mood (spec §31). */
  #pet-wrap.healthy #pet { animation: breathe 3.4s ease-in-out infinite; }
  #pet-wrap.working #pet { animation: breathe 1.5s ease-in-out infinite; }
  #pet-wrap.warning #pet { animation: warnBob 2.6s ease-in-out infinite; }
  #pet-wrap.critical #pet { animation: droop 4.5s ease-in-out infinite; }
  #pet-wrap.reset #pet { animation: bounce 640ms cubic-bezier(0.34, 1.56, 0.64, 1) 4; }
  #pet-wrap.idle #pet { opacity: 0.62; animation: breathe 5s ease-in-out infinite; }
  /* A single short shake when the Pet ENTERS critical; it must not shake forever. */
  #pet-wrap.shake-once #pet { animation: shakeOnce 240ms ease-in-out 2; }
  /* Idle actions (spec §32): low-distraction, one at a time, never during interaction. */
  #pet-wrap.look #pet { animation: lookAround 1.5s ease-in-out 1; }
  #pet-wrap.hop #pet { animation: hop 640ms ease-out 1; }
  #pet-wrap.stretch #pet { animation: stretch 900ms ease-in-out 1; }

  @keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes warnBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes droop { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(2px) scaleY(0.98); } }
  @keyframes bounce {
    0% { transform: translateY(0) scale(1, 1); }
    35% { transform: translateY(-14px) scale(0.96, 1.06); }
    70% { transform: translateY(0) scale(1.06, 0.94); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes shakeOnce {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }
  @keyframes lookAround {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-5deg); }
    60% { transform: rotate(5deg); }
  }
  @keyframes hop {
    0% { transform: translateY(0) scale(1.04, 0.94); }
    40% { transform: translateY(-16px) scale(0.96, 1.05); }
    75% { transform: translateY(0) scale(1.05, 0.95); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes stretch {
    0%, 100% { transform: scale(1, 1); }
    45% { transform: scale(0.94, 1.08); }
    70% { transform: scale(1.03, 0.97); }
  }

  /* Reset sparkles: four brand ticks that flash outward once per bounce cycle. */
  #sparkles { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  #pet-wrap.reset #sparkles { animation: sparkle 640ms ease-out 4; }
  #sparkles i { position: absolute; width: 2px; height: 7px; border-radius: 2px; background: var(--pet); }
  #sparkles i:nth-child(1) { top: 4px; left: 6px; transform: rotate(-35deg); }
  #sparkles i:nth-child(2) { top: 0; right: 10px; transform: rotate(25deg); }
  #sparkles i:nth-child(3) { bottom: 10px; left: 0; transform: rotate(30deg); }
  #sparkles i:nth-child(4) { bottom: 6px; right: 2px; transform: rotate(-25deg); }
  @keyframes sparkle {
    0% { opacity: 0; transform: scale(0.6); }
    40% { opacity: 1; transform: scale(1.1); }
    100% { opacity: 0; transform: scale(1.35); }
  }

  /* ---- Global risk indicator (spec §16) ------------------------------------ */
  /* Separate from the mood: the Pet can be working happily while the system is critical. */
  #halo {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 16px;
    height: 16px;
    display: none;
    pointer-events: none;
  }
  #halo.show { display: block; }
  #halo span {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: var(--alert);
    box-shadow: 0 0 8px var(--alert);
  }
  #halo.crit span::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: var(--alert);
    animation: haloPing 1.4s cubic-bezier(0, 0, 0.2, 1) infinite;
  }
  @keyframes haloPing { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(2.4); opacity: 0; } }

  /* ---- Reset badge --------------------------------------------------------- */
  #badge {
    position: absolute;
    top: 0;
    left: 0;
    display: none;
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(11, 15, 20, 0.92);
    border: 1px solid var(--pet);
    color: #e8edf3;
    font: 600 12px/1.4 'Segoe UI', system-ui, sans-serif;
    white-space: nowrap;
    box-shadow: 0 4px 14px -6px rgba(0, 0, 0, 0.7);
    pointer-events: none;
    transform: translate(-50%, -100%);
  }
  #badge.show { display: block; }

  /* ---- Speech bubble (spec §21–§25) --------------------------------------- */
  #bubble {
    position: absolute;
    top: 0;
    left: 0;
    display: none;
    max-width: 300px;
    padding: 9px 11px 8px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(22, 43, 58, 0.98), rgba(11, 24, 36, 0.98));
    border: 1px solid #385b6c;
    color: #e8edf3;
    font: 12px/1.45 'Segoe UI', system-ui, sans-serif;
    box-shadow: 0 10px 26px -12px rgba(0, 0, 0, 0.85);
    transform: translate(-50%, -100%);
    -webkit-font-smoothing: antialiased;
  }
  #bubble.show { display: block; }
  #bubble.tone-warn { border-color: #6a5320; }
  #bubble.tone-crit { border-color: #6d2b2c; }
  #bubble .b-title { font-weight: 650; font-size: 12.5px; margin-bottom: 3px; color: #b3f2f0; }
  #bubble .b-line { color: #b9c3d0; white-space: nowrap; }
  #bubble .b-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  #bubble button {
    /* Two per row: the spec's action list can reach four buttons, which will not fit on one
       line inside a 300px bubble. */
    flex: 1 1 calc(50% - 3px);
    min-width: 88px;
    background: #173544;
    color: #e8edf3;
    border: 1px solid #345869;
    border-radius: 7px;
    padding: 4px 8px;
    font: 600 11px/1.3 'Segoe UI', system-ui, sans-serif;
    cursor: pointer;
    white-space: nowrap;
  }
  #bubble button:hover { background: #25313f; }

  /*
   * ---- Expression layer (asset spec §4, §11, §28) --------------------------
   * Vector mascots expose stable part classes, so blink / scan / talk / tail / antenna /
   * legs animate inside the artwork without re-resolving the frame. Body motion per mood
   * already lives on #pet above; these target the SVG's own parts.
   */
  .qp-sprite, .qp-head, .qp-eye, .qp-look, .qp-mouth, .qp-tail, .qp-ear,
  .qp-antenna, .qp-leg, .qp-live {
    transform-box: fill-box;
    transform-origin: center;
  }
  .qp-leg { transform-origin: center bottom; }
  .qp-tail { transform-origin: 15% 85%; }
  .qp-head { transform-origin: center bottom; }

  #pet-wrap .qp-eye { animation: qpBlink 5.4s ease-in-out infinite; }
  #pet-wrap .qp-tail { animation: qpTail 4.2s ease-in-out infinite; }
  #pet-wrap .qp-antenna { animation: qpAntenna 3s ease-in-out infinite; }
  #pet-wrap .qp-live { animation: qpLive 2.4s ease-in-out infinite; }

  /* Working: focused eye scan + a faster live dot. */
  #pet-wrap.working .qp-look { animation: qpScan 1.6s ease-in-out infinite; }
  #pet-wrap.working .qp-live { animation-duration: 0.9s; }

  /* Warning tilts its head; critical and reset keep their drawn expression still. */
  #pet-wrap.warning .qp-head { animation: qpTilt 2.6s ease-in-out infinite; }
  #pet-wrap.critical .qp-eye, #pet-wrap.reset .qp-eye { animation: none; }

  /* Transient reactions (spec §26, §28). */
  #pet-wrap.talking .qp-mouth { animation: qpTalk 300ms ease-in-out infinite; }
  #pet-wrap.hovering .qp-sprite { animation: qpHover 600ms ease-out 1; }
  #pet-wrap.clicked .qp-sprite { animation: qpClick 340ms cubic-bezier(0.34, 1.56, 0.64, 1) 1; }
  #pet-wrap.walking .qp-sprite { animation: qpWalkBob 420ms ease-in-out infinite; }
  #pet-wrap.walking .qp-leg { animation: qpLeg 420ms ease-in-out infinite; }
  #pet-wrap.walking .qp-leg-r { animation-delay: -210ms; }
  #pet-wrap.turning .qp-sprite { animation: qpTurn 320ms ease-out 1; }

  @keyframes qpBlink { 0%, 90%, 100% { transform: scaleY(1); } 94%, 96% { transform: scaleY(0.1); } }
  @keyframes qpTail { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(7deg); } }
  @keyframes qpAntenna { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes qpLive { 0%, 100% { opacity: 0.65; transform: scale(1); } 50% { opacity: 1; transform: scale(1.18); } }
  @keyframes qpScan { 0%, 100% { transform: translateX(-1.2px); } 50% { transform: translateX(1.2px); } }
  @keyframes qpTilt { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes qpTalk { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.45); } }
  @keyframes qpHover { 0% { transform: translateY(0); } 40% { transform: translateY(-4px); } 100% { transform: translateY(0); } }
  @keyframes qpClick { 0% { transform: scale(1, 1); } 40% { transform: scale(1.12, 0.88); } 100% { transform: scale(1, 1); } }
  @keyframes qpWalkBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes qpLeg { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
  @keyframes qpTurn { 0% { transform: scaleX(0.7); } 100% { transform: scaleX(1); } }

  /* Wave 1 transient intros (Next Handoff Pack §4 state transitions). */
  #pet-wrap.unknown #pet { opacity: 0.72; animation: breathe 5s ease-in-out infinite; }
  #pet-wrap.intro-warning .qp-sprite { animation: qpWarnFlash 900ms ease-out 1; }
  #pet-wrap.intro-critical .qp-sprite { animation: qpCritShake 900ms ease-out 1; }
  #pet-wrap.celebrate .qp-sprite { animation: qpCelebrate 900ms ease-out 1; }
  @keyframes qpWarnFlash {
    0% { transform: scale(1); }
    30% { transform: scale(1.08) rotate(-3deg); }
    100% { transform: scale(1); }
  }
  @keyframes qpCritShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-3px); }
    40% { transform: translateX(3px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }
  @keyframes qpCelebrate {
    0% { transform: translateY(0); }
    35% { transform: translateY(-8px) scale(1.05); }
    100% { transform: translateY(0); }
  }

  /* ---- Wave 2 micro-behaviors & long-idle (Motion Bible §1, §3) ------------ */
  #pet-wrap.blink .qp-eye { animation: qpBlink 260ms ease-in-out 1; }
  #pet-wrap.look-left .qp-look { animation: qpLookLeft 900ms ease-in-out 1; }
  #pet-wrap.look-right .qp-look { animation: qpLookRight 900ms ease-in-out 1; }
  #pet-wrap.idle-variant-1 .qp-sprite { animation: qpIdleV1 1600ms ease-in-out 1; }
  #pet-wrap.idle-variant-2 .qp-head { animation: qpIdleV2 1600ms ease-in-out 1; }
  #pet-wrap.sit .qp-sprite { transform: translateY(3px) scaleY(0.92); }
  #pet-wrap.lie .qp-sprite { transform: translateY(7px) scaleY(0.8); }
  #pet-wrap.sleep .qp-sprite { transform: translateY(8px) scaleY(0.78); opacity: 0.86; }
  #pet-wrap.sleep .qp-eye { animation: none; }
  #pet-wrap.wake .qp-sprite { animation: qpWake 700ms cubic-bezier(0.34, 1.56, 0.64, 1) 1; }
  #pet-wrap.stopping .qp-sprite { animation: qpStop 420ms ease-out 1; }
  /* Flux Blob glides/morphs instead of stepping (Wave 2 handoff constraint). */
  #pet-wrap.walking.glide .qp-sprite { animation: qpGlide 900ms ease-in-out infinite; }
  #pet-wrap.walking.glide .qp-leg { animation: none; }

  @keyframes qpLookLeft { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-2.2px); } }
  @keyframes qpLookRight { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(2.2px); } }
  @keyframes qpIdleV1 { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-2.5px); } 70% { transform: translateY(0.5px); } }
  @keyframes qpIdleV2 { 0%, 100% { transform: rotate(0deg); } 30% { transform: rotate(-4deg); } 70% { transform: rotate(3deg); } }
  @keyframes qpWake {
    0% { transform: translateY(6px) scaleY(0.84); }
    60% { transform: translateY(-4px) scaleY(1.04); }
    100% { transform: translateY(0) scaleY(1); }
  }
  @keyframes qpStop { 0% { transform: translateY(-2px) scale(1.04, 0.96); } 100% { transform: translateY(0) scale(1, 1); } }
  @keyframes qpGlide { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-3px) scale(1.03, 0.97); } }

  /*
   * Wave 2 posture and look also drive the raster body (#pet), so they work for characters
   * with no SVG parts. Declared after the mood rules so they win while active.
   */
  #pet-wrap.sit #pet { animation: none; transform: translateY(3px) scaleY(0.92); }
  #pet-wrap.lie #pet { animation: none; transform: translateY(7px) scaleY(0.8); }
  #pet-wrap.sleep #pet { animation: none; transform: translateY(8px) scaleY(0.78); opacity: 0.86; }
  #pet-wrap.wake #pet { animation: qpWake 700ms cubic-bezier(0.34, 1.56, 0.64, 1) 1; }
  #pet-wrap.stopping #pet { animation: qpStop 420ms ease-out 1; }
  #pet-wrap.look-left #pet { animation: qpLookLeftBody 900ms ease-in-out 1; }
  #pet-wrap.look-right #pet { animation: qpLookRightBody 900ms ease-in-out 1; }
  @keyframes qpLookLeftBody { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-6deg); } }
  @keyframes qpLookRightBody { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(6deg); } }

  /* Peek bubble: no action row, tighter padding (Wave 2 interaction spec §4). */
  #bubble[data-mode="peek"] { padding: 7px 10px; }
  #bubble[data-mode="peek"] .b-actions { display: none; }

  /*
   * Wave 2 personality differentiation (personality bibles): one motion language per
   * character instead of one shared default.
   */
  #pet-wrap.char-orbit_bot .qp-antenna { animation-duration: 2.2s; }
  #pet-wrap.char-pulse_fox .qp-tail { animation-duration: 3.2s; }
  #pet-wrap.char-pulse_fox .qp-ear { animation: qpEarTwitch 4.6s ease-in-out infinite; }
  #pet-wrap.char-capsule_cat .qp-tail { animation-duration: 5.4s; }
  #pet-wrap.char-capsule_cat .qp-ear { animation: qpEarLed 2.6s ease-in-out infinite; }
  #pet-wrap.char-flux_blob .qp-body { animation: qpBlobMorph 3.8s ease-in-out infinite; }
  #pet-wrap.char-flux_blob .qp-leg { animation: none; }

  @keyframes qpEarTwitch { 0%, 92%, 100% { transform: rotate(0deg); } 95% { transform: rotate(-8deg); } 97% { transform: rotate(6deg); } }
  @keyframes qpEarLed { 0%, 100% { opacity: 0.72; } 50% { opacity: 1; } }
  @keyframes qpBlobMorph { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.04, 0.96); } }

  @media (prefers-reduced-motion: reduce) {
    #pet, #pet-wrap #pet, #pet-wrap #pet *, #sparkles, #halo span::after { animation: none !important; }
    #sparkles { display: none; }
  }
  /* User-forced reduced motion, layered on top of the OS preference (spec §35). */
  #pet-wrap.reduced-motion #pet,
  #pet-wrap.reduced-motion #pet * { animation: none !important; }
  /* Blink is the one behavior reduced motion keeps (Wave 2 Motion Bible §6). The selector
     out-specifies the blanket animation:none rules above so the blink still plays. */
  #pet-wrap.blink #pet .qp-eye { animation: qpBlink 260ms ease-in-out 1 !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="pet-wrap" class="idle" title="QuotaPulse">
    <div id="pet"></div>
    <div id="accessory" aria-hidden="true"></div>
    <div id="skin-trim" aria-hidden="true"></div>
    <div id="sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div id="halo" aria-hidden="true"><span></span></div>
  </div>
  <div id="badge"></div>
  <div id="bubble" role="status">
    <div class="b-title"></div>
    <div class="b-lines"></div>
    <div class="b-actions"></div>
  </div>
</div>
<script>
(function () {
  var SIZE = 64;
  var wrap = document.getElementById('pet-wrap');
  var pet = document.getElementById('pet');
  var badge = document.getElementById('badge');
  var bubble = document.getElementById('bubble');
  var halo = document.getElementById('halo');
  var accessory = document.getElementById('accessory');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var SPEED = { healthy: 36, working: 90, warning: 55, critical: 22, reset: 0, idle: 0 };
  /* Wave 2 local range (Motion Bible §4): Minimal never moves, Companion is 20–150px,
     Roaming is the optional/later feature. Used only when no roaming zones were sent. */
  var RANGE = { minimal: [0, 0], companion: [20, 150], roaming: [120, 520] };
  /* The pack names the healthy loop `idle`, not `healthy`; the map keeps that quirk in one
     place instead of string-building a filename that silently 404s to a blank sprite. */
  var LOOP_ART = { healthy: 'idle/pulsepet_idle.webp', working: 'working/pulsepet_working.webp' };
  /* Raster asset root for the default Orbit Bot (asset spec §17 layout). */
  var ORBIT_ASSETS = '../assets/pets/orbit-bot/';
  /* Bubble button labels (spec §25). `details` opens the popup, which is also what a left
     click does, so the button keeps the label the spec's example bubble shows. */
  var ACTION_LABEL = {
    details: 'Details',
    pin: 'Pin',
    unpin: 'Unpin',
    'open-dashboard': 'Dashboard',
    snooze: 'Snooze 1h',
  };

  var frame = {
    mood: 'idle', spriteIndex: 0, colorCss: '#8a939e', alertColorCss: '#8a939e',
    showGlobalAlert: false, badge: null, bubble: null, movement: 'minimal',
    hasData: false, reducedMotion: false, focus: null, providers: [],
    character: 'orbit_bot', spriteSvg: null,
    animation: 'healthy_idle', animationPlayback: 'loop', animationSrc: null,
    skinAccessory: null, skinAccentCss: null,
    layers: { mood: 'unknown', expression: 'none', locomotion: 'stationary', interaction: 'none', facing: 'right' }
  };
  /*
   * Wave 3: the sprite is positioned at an absolute (x, y) inside the desktop overlay. The
   * main process owns the placement policy; the renderer animates toward targets and reports
   * where it ended up.
   */
  var x = Math.max(0, Math.floor(window.innerWidth / 2 - SIZE / 2));
  var y = Math.max(0, window.innerHeight - SIZE - 8);
  var anchorX = x;
  var anchorY = y;
  var dir = 1;
  /* Direction-specific locomotion classes, the Wave 2 asset contract (walk_left etc.). */
  var walkSide = null;
  var targetX = x;
  var targetY = y;
  var walking = false;
  /** True when the current walk is a main-planned roaming burst / Return Home travel. */
  var roaming = false;
  /** Safe regions (overlay-local) from the main process; local movement is clamped to them. */
  var zones = null;
  /** Overlay origin in screen coordinates, for converting local px to absolute px. */
  var originX = 0;
  var originY = 0;
  /** Wave 3 drag state (click-vs-drag threshold lives in main's policy). */
  var pointerDown = false;
  var dragging = false;
  var suppressClick = false;
  var dragStartClient = null;
  var dragStartSprite = null;
  var locked = false;
  var idleTimer = null;
  var actionTimer = null;
  var last = performance.now();
  var raf = null;
  var hoverOver = false;
  var clickTimer = null;
  var bubbleKey = '';
  var bubbleHideTimer = null;
  var lastMood = 'idle';
  /* Key of the currently injected vector mascot, so a repaint does not restart it. */
  var lastSvgKey = null;
  /* Last raster clip URL chosen from the manifest; avoids reloading the same clip. */
  var lastRasterSrc = null;
  /* Last skin accessory injected, so a repaint every poll does not restart the overlay. */
  var lastAccessorySrc = null;
  /* Last resolved animation id, so a `once` reaction retriggers only when it changes. */
  var lastAnimation = null;
  /*
   * Wave 1 animation ids that add a one-shot expression class on top of the mood. Presence
   * is resolved in the tray; the renderer only maps the resolved id to motion (Phase C).
   */
  var ONCE_ANIM_CLASS = {
    warning_intro: 'intro-warning',
    critical_intro: 'intro-critical',
    reset_celebrate: 'celebrate',
    hover_react: 'hovering',
    click_react: 'clicked'
  };
  var ONCE_ANIM_MS = {
    warning_intro: 1100, critical_intro: 1000, reset_celebrate: 2800,
    hover_react: 600, click_react: 750
  };
  /*
   * Wave 2 behavior state (WAVE2_MOTION_BIBLE.md §3): idle tier is measured from the last
   * user interaction, a posture (sit/lie/sleep) persists until interrupted, and the
   * scheduler randomizes within the tier so the Pet never reads as a metronome.
   */
  var lastInteractionAt = Date.now();
  var posture = null;
  var BODY_ACTION_MS = { look: 1500, 'look-left': 1200, 'look-right': 1200, hop: 1600, stretch: 1600, blink: 260 };
  /* Idle behavior id -> wrapper class. Kept here so the mapping has one home. */
  var CLASS_FOR_IDLE = {
    blink: 'blink', look_left: 'look-left', look_right: 'look-right',
    idle_variant_1: 'idle-variant-1', idle_variant_2: 'idle-variant-2', stretch: 'stretch'
  };
  var CHAR_CLASSES = ['char-orbit_bot', 'char-pulse_fox', 'char-flux_blob', 'char-capsule_cat', 'char-nova', 'char-byte', 'char-mochi', 'char-kuro'];

  // ---- Painting -------------------------------------------------------------
  function paint() {
    // Settings can force reduced motion on top of the OS preference (spec §35, §37).
    reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches || !!frame.reducedMotion;
    // Swap only the mood class: transient classes (hovering/walking/talking...) must survive
    // a repaint, which happens on every poll.
    var moodClass = frame.hasData ? frame.mood : 'idle';
    if (!wrap.classList.contains(moodClass)) {
      wrap.classList.remove('healthy', 'working', 'warning', 'critical', 'reset', 'idle', 'unknown');
      wrap.classList.add(moodClass);
    }
    // Wave 2 personality: a stable class per character lets CSS tune motion language.
    var charClass = 'char-' + frame.character;
    if (!wrap.classList.contains(charClass)) {
      for (var ci = 0; ci < CHAR_CLASSES.length; ci++) wrap.classList.remove(CHAR_CLASSES[ci]);
      wrap.classList.add(charClass);
    }
    wrap.classList.toggle('reduced-motion', !!frame.reducedMotion);
    // Wave 3 skin overlays: only the accessory/trim change; the mood class is untouched.
    paintSkin();
    applyAnimationClass();
    wrap.style.setProperty('--pet', frame.colorCss);
    badge.style.setProperty('--pet', frame.colorCss);
    halo.style.setProperty('--alert', frame.alertColorCss);
    applyArt();

    // A single shake on entering critical, never a permanent one (spec §31).
    if (frame.hasData && frame.mood === 'critical' && lastMood !== 'critical') {
      wrap.classList.add('shake-once');
      setTimeout(function () { wrap.classList.remove('shake-once'); }, 520);
    }
    lastMood = frame.hasData ? frame.mood : 'idle';

    var focusLabel = frame.focus
      ? frame.focus.name + (frame.focus.usedPercent != null ? ' · ' + Math.round(frame.focus.usedPercent) + '%' : '')
      : 'no live quota';
    wrap.title = 'QuotaPulse — ' + focusLabel + ' (click for details)';

    halo.classList.toggle('show', !!frame.showGlobalAlert);
    halo.classList.toggle('crit', !!(frame.global && frame.global.severity === 'crit'));

    var badgeText = frame.badge ? frame.badge + ' to reset' : '';
    badge.textContent = badgeText;
    badge.classList.toggle('show', !!badgeText && frame.hasData);

    paintBubble();
    place();
    scheduleIdle();
  }

  /*
   * Map the tray-resolved Wave 1 animation id onto the expression layer. Only a change of
   * id retriggers a one-shot, so a quota refresh that keeps the same base loop never
   * restarts motion (Next Handoff Pack — restart suppression). Strong reactions are
   * skipped under reduced motion; the manifest already downgraded them to a safe variant.
   */
  function applyAnimationClass() {
    if (frame.animation === lastAnimation) return;
    lastAnimation = frame.animation;
    var cls = ONCE_ANIM_CLASS[frame.animation];
    if (!cls) return;
    if (reduced && (frame.animation === 'critical_intro' || frame.animation === 'warning_intro' || frame.animation === 'reset_celebrate')) return;
    // An alert/acknowledgement interrupts sleep or a resting posture (Wave 2 QA D).
    wake();
    wrap.classList.add(cls);
    setTimeout(function () { wrap.classList.remove(cls); }, ONCE_ANIM_MS[frame.animation] || 900);
  }

  /*
   * Wave 3 skin layer: inject the accessory overlay when the active skin ships one, and
   * surface the decorative accent. Neither touches a status color.
   */
  function paintSkin() {
    var accent = frame.skinAccentCss || frame.colorCss;
    wrap.style.setProperty('--skin-accent', accent);
    var framed = !!(frame.skinAccessory || (frame.skinAccentCss && frame.skinAccentCss !== frame.colorCss));
    wrap.classList.toggle('skin-applied', framed);
    if (frame.skinAccessory) {
      if (lastAccessorySrc !== frame.skinAccessory) {
        lastAccessorySrc = frame.skinAccessory;
        accessory.innerHTML = "<img src='" + frame.skinAccessory + "' alt='' />";
      }
      accessory.classList.add('show');
    } else {
      if (lastAccessorySrc !== null) lastAccessorySrc = null;
      accessory.innerHTML = '';
      accessory.classList.remove('show');
    }
  }

  // ---- Expression layer (spec §28, §31) ------------------------------------
  /*
   * Healthy and working have looping artwork with blink and eye-scan, so the expression
   * layer is a real animation rather than a CSS approximation. Warning, critical and reset
   * have no looping art, so they keep the static sprite frames -- and every state falls
   * back to the sprite under reduced motion, where a looping image would be exactly the
   * motion §35 says to suppress.
   */
  function applyArt() {
    /*
     * Vector mascots arrive pre-resolved in the frame (engine owns mood/colour/ring), so
     * the renderer only swaps the markup when the key actually changes -- a repaint every
     * 15s must not restart the artwork. Raster mascots keep their sprite/WebP asset set.
     */
    // A real Wave 1 clip exists for this animation (Orbit Bot healthy/working today):
    // prefer it over the placeholder art, reloading only when the clip changes.
    if (frame.animationSrc) {
      if (lastRasterSrc !== frame.animationSrc) {
        lastRasterSrc = frame.animationSrc;
        lastSvgKey = null;
        pet.innerHTML = '';
        pet.style.backgroundImage = "url('" + frame.animationSrc + "')";
        pet.style.backgroundSize = 'contain';
        pet.style.backgroundPosition = 'center bottom';
      }
      return;
    }
    if (lastRasterSrc !== null) lastRasterSrc = null;

    if (frame.spriteSvg) {
      var svgKey = frame.spriteSvg;
      if (svgKey !== lastSvgKey) {
        lastSvgKey = svgKey;
        pet.innerHTML = frame.spriteSvg;
      }
      pet.style.backgroundImage = 'none';
      return;
    }
    if (lastSvgKey !== null) {
      lastSvgKey = null;
      pet.innerHTML = '';
    }
    var loop = reduced ? null : LOOP_ART[frame.mood];
    if (loop) {
      pet.style.backgroundImage = "url('" + ORBIT_ASSETS + loop + "')";
      pet.style.backgroundSize = SIZE + 'px ' + SIZE + 'px';
      pet.style.backgroundPosition = '0 0';
      return;
    }
    pet.style.backgroundImage = "url('" + ORBIT_ASSETS + 'sprite/pulsepet_states_sprite.png' + "')";
    pet.style.backgroundSize = SIZE * 5 + 'px ' + SIZE + 'px';
    pet.style.backgroundPosition = '-' + ((frame.spriteIndex || 0) * SIZE) + 'px 0';
  }

  /* The mascot mouths along while a bubble is visible (asset spec §4 talk). */
  function setTalking() {
    wrap.classList.toggle('talking', bubble.classList.contains('show'));
  }

  function paintBubble() {
    var b = frame.bubble;
    var key = b ? (b.kind + '|' + b.mode + '|' + b.title + '|' + b.lines.join('~') + '|' + b.actions.join(',')) : '';
    if (key === bubbleKey) return;
    bubbleKey = key;
    if (bubbleHideTimer) { clearTimeout(bubbleHideTimer); bubbleHideTimer = null; }
    if (!b) { bubble.classList.remove('show'); setTalking(); return; }
    bubble.className = 'tone-' + b.tone;
    // Peek vs expanded (Wave 2 interaction spec §4); the actions row is empty for peek.
    bubble.setAttribute('data-mode', b.mode || 'expanded');
    bubble.querySelector('.b-title').textContent = b.title;
    bubble.querySelector('.b-lines').innerHTML = b.lines.map(function (line) {
      return '<div class="b-line">' + escapeHtml(line) + '</div>';
    }).join('');
    var actions = bubble.querySelector('.b-actions');
    actions.innerHTML = '';
    b.actions.forEach(function (action) {
      var btn = document.createElement('button');
      btn.textContent = ACTION_LABEL[action] || action;
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (window.qpPet) window.qpPet.action(action, b.ownerKey);
      });
      actions.appendChild(btn);
    });
    bubble.classList.add('show');
    setTalking();
    if (b.until) {
      bubbleHideTimer = setTimeout(function () {
        bubble.classList.remove('show');
        setTalking();
      }, Math.max(0, b.until - Date.now()));
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---- Positioning ----------------------------------------------------------
  function place() {
    // ONLY the desktop layer is transformed here; body animation lives on #pet.
    wrap.style.transform = 'translate(' + x + 'px,' + y + 'px) scaleX(' + dir + ')';
    var cx = x + SIZE / 2;
    if (badge.classList.contains('show')) {
      var half = badge.offsetWidth / 2;
      badge.style.left = Math.max(half + 4, Math.min(window.innerWidth - half - 4, cx)) + 'px';
      badge.style.top = Math.max(badge.offsetHeight + 4, y - 4) + 'px';
    }
    if (bubble.classList.contains('show')) {
      var bhalf = bubble.offsetWidth / 2;
      bubble.style.left = Math.max(bhalf + 6, Math.min(window.innerWidth - bhalf - 6, cx)) + 'px';
      bubble.style.top = Math.max(bubble.offsetHeight + 6, y - 8) + 'px';
    }
    // The pet can walk out from under a stationary cursor; re-read the pointer so the
    // transparent overlay does not keep capturing clicks.
    if (walking) syncHover();
  }

  // ---- Desktop motion + idle behaviour (spec §32–§34) ----------------------
  function range() { return RANGE[frame.movement] || RANGE.minimal; }
  function bubbleVisible() { return bubble.classList.contains('show'); }

  /**
   * Clamp a sprite position into the nearest safe region, so local movement never parks the
   * Pet over a bezel gap or off the desktop (SAFE_ZONE_SPEC.md §5).
   */
  function clampToZones(px, py) {
    if (!zones || zones.length === 0) {
      return {
        x: Math.max(0, Math.min(window.innerWidth - SIZE, px)),
        y: Math.max(0, Math.min(window.innerHeight - SIZE, py)),
      };
    }
    for (var i = 0; i < zones.length; i++) {
      var z = zones[i];
      if (px >= z.x && px + SIZE <= z.x + z.width && py >= z.y && py + SIZE <= z.y + z.height) {
        return { x: px, y: py };
      }
    }
    var best = null;
    var bestDistance = Infinity;
    for (var j = 0; j < zones.length; j++) {
      var zone = zones[j];
      var cx = Math.max(zone.x, Math.min(zone.x + zone.width - SIZE, px));
      var cy = Math.max(zone.y, Math.min(zone.y + zone.height - SIZE, py));
      var d = (cx - px) * (cx - px) + (cy - py) * (cy - py);
      if (d < bestDistance) {
        bestDistance = d;
        best = { x: cx, y: cy };
      }
    }
    return best || { x: px, y: py };
  }

  /** A random point inside one of the safe regions, weighted by area. */
  function zoneTarget() {
    var total = 0;
    for (var i = 0; i < zones.length; i++) total += zones[i].width * zones[i].height;
    if (total <= 0) return { x: x, y: y };
    var roll = Math.random() * total;
    for (var j = 0; j < zones.length; j++) {
      var zone = zones[j];
      var area = zone.width * zone.height;
      if (roll < area) {
        var maxX = Math.max(zone.x, zone.x + zone.width - SIZE);
        var maxY = Math.max(zone.y, zone.y + zone.height - SIZE);
        return { x: zone.x + Math.random() * (maxX - zone.x), y: zone.y + Math.random() * (maxY - zone.y) };
      }
      roll -= area;
    }
    return { x: x, y: y };
  }

  /** Wave 2: urgent intros/click suppress autonomous locomotion (Motion Bible §2). */
  function interactionBlocked() {
    var i = frame.layers && frame.layers.interaction;
    return i === 'warning_intro' || i === 'critical_intro' || i === 'reset_celebrate' || i === 'click_react';
  }

  /** Whether the Pet may walk right now: mode, reduced motion, hover, bubble, intro. */
  function locomotionAllowedLocal() {
    if (reduced) return false;
    if (range()[1] <= 0) return false;
    if (hoverOver || bubbleVisible()) return false;
    if (interactionBlocked()) return false;
    return true;
  }

  /** A user action wakes any posture and restarts the idle clock (Motion Bible §3). */
  function userInteracted() {
    lastInteractionAt = Date.now();
    wake();
  }

  function setPosture(name) {
    wake();
    posture = name;
    wrap.classList.add(name);
    actionTimer = setTimeout(function () { actionTimer = null; scheduleIdle(); }, 4_000);
  }

  function wake() {
    if (!posture) return;
    wrap.classList.remove(posture);
    posture = null;
    wrap.classList.add('wake');
    setTimeout(function () { wrap.classList.remove('wake'); }, 700);
  }

  /**
   * Wave 2 idle scheduler (Motion Bible §3): behaviors unlock in tiers measured from the
   * last interaction (10s blink/look, 18s idle variants, 35s variants, 60s sit/lie, 120s
   * sleep). Locomotion is only in the pool when the policy allows it, and the delay is
   * randomized so the Pet never fires on a fixed cadence.
   */
  function scheduleIdle() {
    if (!frame.hasData || idleTimer || walking || actionTimer) return;
    idleTimer = setTimeout(function () {
      idleTimer = null;
      if (hoverOver || bubbleVisible() || interactionBlocked()) { scheduleIdle(); return; }
      // Reduced motion keeps a subtle blink and nothing more (Motion Bible §6).
      if (reduced) { playBodyAction('blink'); return; }
      var idleMs = Date.now() - lastInteractionAt;
      var pick = pickIdle(idleMs);
      if (!pick) { scheduleIdle(); return; }
      if (pick === 'reposition') startWalk();
      else if (pick === 'sit' || pick === 'lie_down' || pick === 'sleep_loop') setPosture(pick === 'lie_down' ? 'lie' : pick);
      else playBodyAction(CLASS_FOR_IDLE[pick] || pick);
    }, 6_000 + Math.random() * 12_000);
  }

  /** Weighted pick from the tiers, mirroring `pickIdleBehavior` in pet/wave2.ts. */
  function pickIdle(idleMs) {
    var tiers = [
      { after: 10_000, choices: ['blink', 'look_left', 'look_right'] },
      { after: 18_000, choices: ['blink', 'look_left', 'look_right', 'idle_variant_1', 'idle_variant_2'] },
      { after: 35_000, choices: ['idle_variant_1', 'idle_variant_2', 'look_left', 'look_right', 'stretch'] },
      { after: 60_000, choices: ['sit', 'lie_down', 'stretch', 'idle_variant_1'] },
      { after: 120_000, choices: ['sleep_loop', 'lie_down'] }
    ];
    var pool = [];
    for (var i = 0; i < tiers.length; i++) if (idleMs >= tiers[i].after) pool = tiers[i].choices;
    if (pool.length === 0) return null;
    if (locomotionAllowedLocal()) pool = pool.concat(['reposition']);
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function playBodyAction(name) {
    // The mood class is on the wrapper and would be replaced by the next frame, so the
    // action class is added on top and removed by its own timer.
    wrap.classList.add(name);
    actionTimer = setTimeout(function () {
      actionTimer = null;
      wrap.classList.remove(name);
      scheduleIdle();
    }, BODY_ACTION_MS[name] || 1_600);
  }

  /** A renderer-driven idle reposition inside the local range (Companion mode). */
  function startWalk() {
    if (!locomotionAllowedLocal()) return;
    var r = range();
    var useZones = !!(zones && zones.length > 0);
    if (!useZones && r[1] <= 0) return;
    var target;
    if (useZones) {
      target = zoneTarget();
    } else {
      var distance = r[0] + Math.random() * (r[1] - r[0]);
      var angle = Math.random() * Math.PI * 2;
      target = clampToZones(x + Math.cos(angle) * distance, y + Math.sin(angle) * distance);
    }
    beginWalkTo(target.x, target.y, false);
  }

  /** Start (or retarget) a walk toward an overlay-local point, turning first if needed. */
  function beginWalkTo(tx, ty, isRoam) {
    var clamped = clampToZones(tx, ty);
    targetX = clamped.x;
    targetY = clamped.y;
    roaming = !!isRoam;
    var prevDir = dir;
    dir = targetX < x ? -1 : 1;
    var side = dir < 0 ? 'left' : 'right';
    if (dir !== prevDir) {
      // Turn before walking (Wave 2 layering rules §4). The direction-specific class is
      // the asset contract id (turn_left/right); `.turning` is the shared visual.
      wrap.classList.add('turning', 'turn-' + side);
      setTimeout(function () { wrap.classList.remove('turning', 'turn-left', 'turn-right'); }, 340);
      // Mirror facing so the engine can reason about the next turn.
      if (window.qpPet && window.qpPet.facing) window.qpPet.facing(side);
    }
    walking = true;
    walkSide = side;
    wrap.classList.add('walking', 'walking-' + side);
    // Flux Blob glides/morphs rather than faking leg steps (Wave 2 handoff constraint).
    if (frame.character === 'flux_blob') wrap.classList.add('glide');
    loop();
  }

  function loop() {
    if (raf == null) raf = requestAnimationFrame(tick);
  }

  function tick(now) {
    raf = null;
    var dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (walking) {
      var speed = reduced ? 0 : (SPEED[frame.mood] || 0);
      var dx = targetX - x;
      var dy = targetY - y;
      var distance = Math.sqrt(dx * dx + dy * dy);
      var step = speed * dt;
      if (distance <= step || speed === 0) {
        var cameFromRoam = roaming;
        x = targetX;
        y = targetY;
        walking = false;
        roaming = false;
        wrap.classList.remove('walking', 'walking-left', 'walking-right');
        wrap.classList.remove('glide');
        // A clean mechanical stop at the destination (Wave 2 layering rules §4). The
        // direction-specific class is the asset contract id (stop_left/right).
        wrap.classList.add('stopping', 'stop-' + (walkSide || 'right'));
        setTimeout(function () { wrap.classList.remove('stopping', 'stop-left', 'stop-right'); }, 420);
        walkSide = null;
        anchorX = x;
        anchorY = y;
        if (window.qpPet) {
          // A main-planned burst reports `roamed` (starts the idle cooldown there); a local
          // reposition reports `moved` (persisted without touching the cadence).
          if (cameFromRoam && window.qpPet.roamed) window.qpPet.roamed(Math.round(x), Math.round(y));
          else if (window.qpPet.moved) window.qpPet.moved(Math.round(x), Math.round(y));
        }
      } else {
        x += (dx / distance) * step;
        y += (dy / distance) * step;
      }
      place();
    }
    if (walking) loop();
    else scheduleIdle();
  }

  // ---- Interactions (spec §26) ---------------------------------------------
  function interactiveAt(e) {
    var el = document.elementFromPoint(e.clientX, e.clientY);
    return !!(el && el.closest && el.closest('#pet-wrap, #bubble'));
  }

  var lastMouse = null;
  function syncHover() {
    if (!window.qpPet || !lastMouse) return;
    var over = interactiveAt({ clientX: lastMouse.x, clientY: lastMouse.y });
    if (over !== hoverOver) {
      hoverOver = over;
      // Curious/react pose while the pointer is on the mascot (asset spec §4 hover_react).
      wrap.classList.toggle('hovering', over);
      // Hovering wakes a resting Pet and pauses locomotion (Wave 2 interaction spec §2).
      if (over) userInteracted();
      window.qpPet.hover(over);
    }
  }

  document.addEventListener('mousemove', function (e) {
    lastMouse = { x: e.clientX, y: e.clientY };
    syncHover();
  });

  // Losing the pointer while interactive would leave the whole transparent strip capturing
  // clicks, so the click-through state is reset the moment the cursor leaves.
  document.addEventListener('mouseleave', function () {
    lastMouse = null;
    wrap.classList.remove('hovering');
    if (hoverOver && window.qpPet) {
      hoverOver = false;
      window.qpPet.hover(false);
    }
  });

  // ---- Wave 3 drag & reposition (DRAG_REPOSITION_SPEC.md) -------------------
  /*
   * A small pointer travel is a click, not a drag. The main process clamps/snaps/persists on
   * release, so the renderer only moves its own sprite and reports the final point.
   */
  var DRAG_THRESHOLD = 6;
  pet.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 || locked) return;
    pointerDown = true;
    dragging = false;
    suppressClick = false;
    dragStartClient = { x: e.clientX, y: e.clientY };
    dragStartSprite = { x: x, y: y };
    try { pet.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  });

  document.addEventListener('pointermove', function (e) {
    if (!pointerDown || !dragStartClient) return;
    var dx = e.clientX - dragStartClient.x;
    var dy = e.clientY - dragStartClient.y;
    if (!dragging) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) < DRAG_THRESHOLD) return;
      dragging = true;
      suppressClick = true;
      wrap.classList.add('dragging');
      if (window.qpPet && window.qpPet.dragStart) window.qpPet.dragStart();
    }
    var next = clampToZones(dragStartSprite.x + dx, dragStartSprite.y + dy);
    x = next.x;
    y = next.y;
    place();
  });

  function endDrag(e) {
    if (!pointerDown) return;
    pointerDown = false;
    if (dragging) {
      dragging = false;
      wrap.classList.remove('dragging');
      if (window.qpPet && window.qpPet.dragEnd) window.qpPet.dragEnd(Math.round(x), Math.round(y));
    }
    dragStartClient = null;
    dragStartSprite = null;
    try { pet.releasePointerCapture(e.pointerId); } catch (err) { /* already released */ }
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);

  pet.addEventListener('click', function (e) {
    e.stopPropagation();
    // A completed drag is not a click; swallow the synthetic click it produces.
    if (suppressClick) { suppressClick = false; return; }
    userInteracted();
    // A quick squash acknowledges the press (asset spec §4 click_react).
    wrap.classList.add('clicked');
    setTimeout(function () { wrap.classList.remove('clicked'); }, 360);
    // Wait out the double-click window so a dblclick does not also toggle the bubble.
    if (clickTimer) return;
    clickTimer = setTimeout(function () {
      clickTimer = null;
      if (window.qpPet) window.qpPet.click(x + SIZE / 2);
    }, 220);
  });

  pet.addEventListener('dblclick', function () {
    if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
    if (window.qpPet) window.qpPet.openDashboard();
  });

  document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    if (window.qpPet) window.qpPet.contextMenu();
  });

  if (window.qpPet) window.qpPet.onState(function (next) {
    frame = next;
    paint();
  });
  if (window.qpPet && window.qpPet.onPosition) {
    window.qpPet.onPosition(function (pos) {
      if (!pos || !Number.isFinite(pos.x) || !Number.isFinite(pos.y)) return;
      originX = Number.isFinite(pos.originX) ? pos.originX : 0;
      originY = Number.isFinite(pos.originY) ? pos.originY : 0;
      var clamped = clampToZones(pos.x, pos.y);
      x = clamped.x;
      y = clamped.y;
      anchorX = x;
      anchorY = y;
      targetX = x;
      targetY = y;
      walking = false;
      place();
    });
  }
  if (window.qpPet && window.qpPet.onDesktop) {
    window.qpPet.onDesktop(function (desktop) {
      if (!desktop) return;
      zones = desktop.zones && desktop.zones.length ? desktop.zones : null;
      locked = !!desktop.lockPosition;
      wrap.classList.toggle('position-locked', locked);
      // Never leave the Pet parked where there is no screen under it.
      var clamped = clampToZones(x, y);
      if (clamped.x !== x || clamped.y !== y) {
        x = clamped.x;
        y = clamped.y;
        anchorX = x;
        anchorY = y;
        targetX = x;
        targetY = y;
      }
      place();
    });
  }
  if (window.qpPet && window.qpPet.onRoamTarget) {
    window.qpPet.onRoamTarget(function (target) {
      if (!target || !Number.isFinite(target.x) || !Number.isFinite(target.y)) return;
      // A user interrupt always wins: the main process re-checks eligibility on its own tick.
      if (locked || reduced || hoverOver || bubbleVisible() || interactionBlocked()) return;
      beginWalkTo(target.x, target.y, true);
    });
  }
  paint();
})();
</script>
